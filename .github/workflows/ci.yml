name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile python sources
        run: python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in ['install.py', 'uninstall.py'] + glob.glob('harnesses/devin/payload/hooks/*.py')]"

      - name: Validate managed config JSONs
        run: python -c "import json; d=json.load(open('harnesses/devin/payload/config.managed.json')); assert 'permissions' in d and 'hooks' in d; o=json.load(open('harnesses/opencode/payload/config.managed.json')); assert 'permissions' in o and 'default_agent' in o and 'agents' in o and o['experimental']['subagent_depth']"

      - name: Payload is in sync with shared sources
        run: python build.py --check

      - name: Validate agent profile frontmatter
        shell: bash
        run: |
          python - <<'EOF'
          import glob, re
          for f in glob.glob('harnesses/devin/payload/agents/*.md'):
              t = open(f, encoding='utf-8').read()
              assert t.startswith('---'), f'{f}: missing frontmatter'
              fm = t.split('---')[1]
              for k in ('name', 'description', 'model'):
                  assert re.search(rf'^{k}:', fm, re.M), f'{f}: missing {k}'
          for f in glob.glob('harnesses/opencode/payload/agents/*.md'):
              t = open(f, encoding='utf-8').read()
              assert t.startswith('---'), f'{f}: missing frontmatter'
              fm = t.split('---')[1]
              for k in ('description', 'mode'):
                  assert re.search(rf'^{k}:', fm, re.M), f'{f}: missing {k}'
          print('profiles ok')
          EOF

      - name: Install devin into sandbox
        run: python install.py --harness devin --devin-home "${{ runner.temp }}/devin-sb"

      - name: Install opencode into sandbox
        run: python install.py --harness opencode --opencode-home "${{ runner.temp }}/oc-sb"

      - name: Sync check (both)
        run: |
          python install.py --harness devin --devin-home "${{ runner.temp }}/devin-sb" --check
          python install.py --harness opencode --opencode-home "${{ runner.temp }}/oc-sb" --check
        shell: bash

      - name: Re-install is a no-op
        run: |
          out=$(python install.py --harness devin --devin-home "${{ runner.temp }}/devin-sb")
          echo "$out" | grep -q "already in sync" || { echo "$out"; exit 1; }
          out=$(python install.py --harness opencode --opencode-home "${{ runner.temp }}/oc-sb")
          echo "$out" | grep -q "already in sync" || { echo "$out"; exit 1; }
        shell: bash

      - name: Local e2e test suite (sandboxed)
        run: python tests/test_e2e.py

      - name: Uninstall leaves it clean
        run: |
          python uninstall.py --harness devin --devin-home "${{ runner.temp }}/devin-sb"
          python uninstall.py --harness opencode --opencode-home "${{ runner.temp }}/oc-sb"
          test ! -f "${{ runner.temp }}/devin-sb/agentic.json"
          test ! -f "${{ runner.temp }}/devin-sb/AGENTS.md"
          test ! -f "${{ runner.temp }}/oc-sb/agentic.json"
          test ! -f "${{ runner.temp }}/oc-sb/AGENTS.md"
        shell: bash

  live-probes:
    # Real CLI invocations against sandbox homes. Requires repo secret:
    #   DEVIN_CREDENTIALS_TOML — contents of %APPDATA%\devin\credentials.toml
    #   var DEVIN_PROXY_REPO    — owner/repo of the devin-proxy (defaults in test)
    # Job auto-skips on forks/PRs where the secret is absent.
    runs-on: windows-latest
    if: vars.LIVE_TESTS == '1' || vars.DEVIN_CREDENTIALS_TOML_SET == '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Devin CLI
        run: |
          # setup.ps1 ends with interactive `devin setup` — do the bundle
          # install part manually so the step stays non-interactive.
          $ErrorActionPreference='Stop'; $ProgressPreference='SilentlyContinue'
          $m = (irm https://static.devin.ai/cli/current/manifest.json)
          $p = $m.platforms.'x86_64-pc-windows'
          $zip = "$env:TEMP\devin-$($m.version).zip"
          Invoke-WebRequest $p.url -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $p.sha256.ToLower()) { throw 'sha256 mismatch' }
          $ver = "$env:LOCALAPPDATA\devin\cli\_versions\$($m.version)"
          $tmp = "$env:TEMP\devin-extract"
          Expand-Archive $zip $tmp -Force
          New-Item -ItemType Directory -Path $ver,$env:LOCALAPPDATA\devin\cli\bin -Force | Out-Null
          Copy-Item "$tmp\*" $ver -Recurse -Force
          Copy-Item "$ver\bin\devin.exe" "$env:LOCALAPPDATA\devin\cli\bin\devin.exe" -Force
          echo "$env:LOCALAPPDATA\devin\cli\bin" >> $env:GITHUB_PATH
          & "$env:LOCALAPPDATA\devin\cli\bin\devin.exe" version

      - name: Install OpenCode CLI
        run: |
          npm install -g @opencode/cli
          opencode --version

      - name: Live devin probe (sandbox home + real creds)
        env:
          DEVIN_CREDENTIALS_TOML: ${{ secrets.DEVIN_CREDENTIALS_TOML }}
        run: python tests/live_devin.py

      - name: Live opencode probe (sandbox home + devin-proxy)
        env:
          DEVIN_CREDENTIALS_TOML: ${{ secrets.DEVIN_CREDENTIALS_TOML }}
          DEVIN_PROXY_REPO: ${{ vars.DEVIN_PROXY_REPO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python tests/live_opencode.py
